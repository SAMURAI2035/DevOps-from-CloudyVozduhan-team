server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 1. Все запросы к API проксируем на бэкенд
    location /login { proxy_pass http://backend:8000; }
    location /complaints { proxy_pass http://backend:8000; }
    location /investigate { proxy_pass http://backend:8000; }
    location /audit-log { proxy_pass http://backend:8000; }
    location /cases { proxy_pass http://backend:8000; }
    location /full-profile { proxy_pass http://backend:8000; }
    location /frauds { proxy_pass http://backend:8000; }
    location /api/ { proxy_pass http://backend:8000; }

    # 2. Всё остальное (HTML, CSS, JS, картинки) раздаем как статику
    location / {
        try_files $uri $uri/ /index.html;
    }
}